<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <title>Algoritmos</title>
    <style>
        body {
            background-color: #291f7f;  
        }

        h1 {
            text-align: center;
            color: white;
            font-family: 'Asap', sans-serif;
            font-size: 2.5rem;
            padding: 1.5rem;
            margin-top: 2.5rem;
            text-shadow: 2px 2px 2px rgba(0, 0, 0, 0.222);;
        }

        input {
            width: 14rem;
            background-color: rgb(184, 183, 183);
            border: none;
            padding: 2rem;
            margin: 0.5rem;
            cursor: pointer;
            font-family: 'Asap', sans-serif;
            font-size: 1rem;
            border-radius: 0.5rem;
            box-shadow: 2px 2px 2px 2px rgba(0, 0, 0, 0.222);
        }

        input:hover{
            background-color: rgb(120, 115, 166);
            color: white;
        }
    </style>
</head>
<body>
    <h1>Exercício de algoritmos repetições</h1>

    <div style="display: flex; flex-wrap: wrap; justify-content: center;">
        <input 
            onclick="somaImpares()" 
            type="button" 
            value="Questão 1">
        <input 
            onclick="menorEMaiorAltura()" 
            type="button" 
            value="Questão 2">
        <input 
            onclick="mediaAritmetica()" 
            type="button" 
            value="Questão 3">
        <input 
            onclick="quantidadeNosIntervalos()" 
            type="button" 
            value="Questão 4">
        <input 
            onclick="algoritmoEstruturado()" 
            type="button" 
            value="Questão 5">
        <input 
            onclick="imparesEntre100E200()" 
            type="button" 
            value="Questão 6">
        <input 
            onclick="tabuadaDeN()" 
            type="button" 
            value="Questão 7">
        <input 
            onclick="progressaoAritmetica()" 
            type="button" 
            value="Questão 8">
        <input 
            onclick="progressaoGeometrica()" 
            type="button" 
            value="Questão 9">
        <input 
            onclick="variavelSequencial()" 
            type="button" 
            value="Questão 10">
    </div>

    <script src="script.js"></script>
</body>
</html>
